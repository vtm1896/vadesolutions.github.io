<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vade - Email Verified</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-grid-bg"></div>

    <main class="login-main fade-in-up">
        <div class="login-header">
            <div class="login-logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <span class="login-logo-text">Vade</span>
        </div>

        <div class="login-card" style="text-align:center;">
            <div style="font-size:3rem;margin-bottom:16px;">&#10003;</div>
            <h1 class="login-title">You're verified!</h1>
            <p class="login-subtitle" style="margin-bottom:24px;">Your email has been confirmed. You can now log in and access everything.</p>
            <a href="login.html" class="btn-login-submit" style="display:inline-block;text-decoration:none;">Log in &rarr;</a>
        </div>
    </main>
</body>
</html>
