<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vade - Page Not Found</title>
    <link rel="icon" type="image/png" href="/NEW_VADE_LOGO-removebg-preview.png?v=7">
    <meta name="theme-color" content="#050505">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .nf-card {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 56px 44px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .nf-code {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
        }
        .nf-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .nf-text {
            color: #8a8a94;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .nf-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .nf-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .nf-btn:hover { transform: translateY(-2px); }
        .nf-primary {
            background: #8b5cf6;
            color: #fff;
            border: 1px solid #8b5cf6;
        }
        .nf-primary:hover { background: #7c4ef0; }
        .nf-ghost {
            background: transparent;
            color: #c8c8d0;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .nf-ghost:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
        @media (max-width: 480px) {
            .nf-card { padding: 44px 24px; }
            .nf-code { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <main class="nf-card">
        <div class="nf-code">404</div>
        <h1 class="nf-title">Page slipped through the walls</h1>
        <p class="nf-text">This page doesn't exist or has moved somewhere darker. The nest checked twice.</p>
        <div class="nf-actions">
            <a href="/" class="nf-btn nf-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Back home
            </a>
            <a href="/products.html" class="nf-btn nf-ghost">Browse products</a>
        </div>
    </main>
</body>
</html>
