<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vade - Log in</title>
    <meta name="description" content="Log in to your Vade account.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <!-- Optional Dotted Grid Background -->
    <div class="login-grid-bg"></div>

    <main class="login-main fade-in-up">
        <!-- Logo Header -->
        <div class="login-header">
            <div class="login-logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <span class="login-logo-text">Vade</span>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h1 class="login-title">Welcome back.</h1>
            <p class="login-subtitle">Don't have an account? <a href="register.html">Create one here</a></p>

            <form class="login-form">
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" placeholder="posty" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="********" required>
                        <button type="button" class="btn-toggle-password">
                            <!-- Eye icon -->
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login-submit">Log in &rarr;</button>
            </form>

            <div class="login-divider">
                <span>OR</span>
            </div>

            <a href="#" class="btn-discord-login" id="btn-discord">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.865-.608 1.25-1.845-.277-3.68-.277-5.487 0-.163-.393-.406-.874-.618-1.25a.077.077 0 00-.079-.037A19.74 19.74 0 00.495 4.37a.07.07 0 00-.032.028C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057c2.053 1.508 4.041 2.423 5.993 3.029a.078.078 0 00.084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 00-.042-.106c-.653-.248-1.274-.55-1.872-.892a.077.077 0 01-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 01.078-.011c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 01.079.01c.12.099.245.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.076.076 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028c1.961-.607 3.95-1.522 6.002-3.029a.077.077 0 00.032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.029zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Continue with Discord
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="main.js"></script>
    <script>
        document.querySelector('.btn-toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        const form = document.querySelector('.login-form');
        const submitBtn = form.querySelector('button[type="submit"]');
        const errorBox = document.createElement('p');
        errorBox.style.cssText = 'color:#ef4444;font-size:0.85rem;margin-top:10px;display:none;';
        form.appendChild(errorBox);

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const sb = window.supabaseClient;

            // Look up email from username
            const { data: email, error: lookupErr } = await sb.rpc('get_email_by_username', { uname: username });

            if (lookupErr || !email) {
                errorBox.textContent = 'Username not found.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in \u2192';
                return;
            }

            const { data, error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                errorBox.textContent = error.message || 'Invalid username or password.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in \u2192';
            } else {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('btn-discord').addEventListener('click', function (e) {
            e.preventDefault();
            window.supabaseClient.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin + '/discord-callback.html',
                    scopes: 'identify guilds'
                }
            });
        });
    </script>
    <script src="logo-data.js"></script>
    <script src="logo-replace.js"></script>
</body>
</html>
