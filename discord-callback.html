<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vade - Discord</title>
    <link rel="icon" type="image/png" href="NEW_VADE_LOGO-removebg-preview.png?v=8">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Vade">
    <meta property="og:title" content="Vade - Discord">
    <meta property="og:description" content="Vade - premium, reliable toolset built for performance, security, and a seamless experience.">
    <meta property="og:url" content="https://vadesolutions.fun/discord-callback.html">
    <meta property="og:image" content="https://vadesolutions.fun/NEW_VADE_LOGO-removebg-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#050505">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="login-body">
    <div class="login-grid-bg"></div>
    <main class="login-main fade-in-up">
        <div class="login-header">
            <a href="index.html" class="logo">
                <img src="" alt="Vade" class="logo-img" id="nav-logo">
            </a>
        </div>
        <div class="login-card" style="text-align:center;">
            <p style="color:#888;font-size:0.9rem;margin-bottom:16px;">Checking your Discord status...</p>
            <div id="status-msg" style="color:#fff;font-size:0.95rem;"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js?v=8"></script>
    <script src="supabase-client.js?v=8"></script>
    <script>
    (async function () {
        var sb = window.supabaseClient;
        var GUILD_ID = '1490213290113241169';
        var statusMsg = document.getElementById('status-msg');

        var { data, error } = await sb.auth.getSession();
        var session = data.session;

        if (!session) {
            statusMsg.textContent = 'Not authenticated. Redirecting...';
            window.location.href = 'login.html';
            return;
        }

        var providerToken = session.provider_token;

        if (!providerToken) {
            statusMsg.textContent = 'No Discord token found. Trying login...';
            window.location.href = 'login.html';
            return;
        }

        try {
            var guildsRes = await fetch('https://discord.com/api/v10/users/@me/guilds', {
                headers: { 'Authorization': 'Bearer ' + providerToken }
            });
            var guilds = await guildsRes.json();

            var isInServer = guilds.some(function (g) { return g.id === GUILD_ID; });

            if (isInServer) {
                var user = session.user;
                var discordUser = await fetch('https://discord.com/api/v10/users/@me', {
                    headers: { 'Authorization': 'Bearer ' + providerToken }
                }).then(function (r) { return r.json(); });

                var { error: upsertErr } = await sb.from('profiles').upsert({
                    id: user.id,
                    discord_id: discordUser.id,
                    avatar: discordUser.avatar || null,
                    username: user.user_metadata.username || discordUser.username,
                    discord_username: discordUser.username || null
                }, { onConflict: 'id' });

                if (upsertErr) {
                    console.error('Discord upsert error:', upsertErr);
                    statusMsg.textContent = 'Error saving Discord info: ' + upsertErr.message;
                    return;
                }

                window.location.href = 'dashboard.html';
            } else {
                await sb.auth.signOut();
                window.location.href = 'join-discord.html';
            }
        } catch (e) {
            statusMsg.textContent = 'Error checking Discord. Please try again.';
        }
    })();
    </script>
    <script src="logo-data.js?v=8"></script>
    <script>if(window.VADE_LOGO){var el=document.getElementById('nav-logo');if(el)el.src=window.VADE_LOGO;}</script>
</body>
</html>
